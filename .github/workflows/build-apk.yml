name: Собрать APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Сборка Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Подготовить Android SDK
        uses: android-actions/setup-android@v3
      - name: Установить Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Скачать Gradle 8.9
        run: |
          curl -L --fail --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip -o "$RUNNER_TEMP/gradle-8.9-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"
      - name: Собрать APK
        run: "$RUNNER_TEMP/gradle-8.9/bin/gradle" --no-daemon assembleDebug
      - name: Сохранить готовый APK
        uses: actions/upload-artifact@v4
        with:
          name: MoiBudilnik-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
